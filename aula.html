<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aula</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://drlmrqgqauzbrderovik.supabase.co">
<link rel="stylesheet" href="style.css">
</head>
<body oncontextmenu="return false;">
  <div class="topbar">
    <div class="eyebrow">Planta Mestra</div>
    <a class="logout" href="#" onclick="sair()">Sair</a>
  </div>

  <div class="aula-wrap">
    <a class="aula-back" href="membros.html">← Voltar aos módulos</a>
    <div class="aula-eyebrow" id="modulo-nome">Carregando...</div>
    <h1 class="aula-titulo" id="aula-nome">—</h1>

    <div class="pdf-vault">
      <div class="pdf-vault-inner">
        <div id="pdf-status" style="padding:40px; text-align:center; color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:12px;">Carregando documento...</div>
        <div id="pdf-pages"></div>
      </div>
    </div>

    <div class="aula-marcar-wrap">
      <button id="btn-concluir" class="btn-concluir" onclick="alternarConcluida()">✓ Marcar como concluída</button>
    </div>

    <div class="aula-nav">
      <a href="#" id="btn-anterior">← Aula anterior</a>
      <a href="#" id="btn-proxima">Próxima aula →</a>
    </div>
  </div>

  <!-- BLOCO DE ANOTAÇÕES FLUTUANTE -->
  <div class="notas-flutuante">
    <button class="notas-toggle" id="notas-toggle" onclick="toggleNotas()">📝</button>
    <div class="notas-painel" id="notas-painel">
      <div class="notas-header">
        <span>Suas anotações</span>
        <button class="notas-fechar" onclick="toggleNotas()">✕</button>
      </div>
      <textarea id="notas-texto" placeholder="Anote aqui os insights dessa aula..." oninput="salvarNotas()"></textarea>
      <button class="notas-baixar" onclick="baixarNotas()">⬇ Baixar anotações</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    // bloqueia atalhos comuns de salvar/imprimir/inspecionar
    document.addEventListener('keydown', function(e){
      if(
        (e.ctrlKey && (e.key === 's' || e.key === 'S')) ||
        (e.ctrlKey && (e.key === 'p' || e.key === 'P')) ||
        (e.key === 'F12') ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i'))
      ){
        e.preventDefault();
      }
    });

    async function renderizarPdf(url){
      const status = document.getElementById('pdf-status');
      const container = document.getElementById('pdf-pages');
      try{
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        const pdf = await pdfjsLib.getDocument(url).promise;
        status.style.display = 'none';

        for(let n = 1; n <= pdf.numPages; n++){
          const page = await pdf.getPage(n);
          const containerWidth = container.clientWidth || document.querySelector('.pdf-vault-inner').clientWidth;
          const baseViewport = page.getViewport({ scale: 1 });
          const scale = (containerWidth / baseViewport.width) * (window.devicePixelRatio || 1);
          const viewport = page.getViewport({ scale });

          const canvas = document.createElement('canvas');
          canvas.style.width = '100%';
          canvas.style.display = 'block';
          canvas.height = viewport.height;
          canvas.width = viewport.width;
          container.appendChild(canvas);

          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        }
      } catch(err){
        status.style.display = 'block';
        status.textContent = 'Não foi possível carregar o documento.';
        console.error(err);
      }
    }

    function getParam(nome){
      return new URLSearchParams(window.location.search).get(nome);
    }

    let currentUserId = null;
    let currentAulaId = null;
    let concluida = false;

    async function checarAcesso(){
      const { data: { session } } = await supabaseClient.auth.getSession();
      if(!session){ window.location.href = 'login.html'; return null; }
      const user = session.user;
      const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
      if(!profile || (!profile.approved && !profile.is_admin)){
        window.location.href = 'pendente.html'; return null;
      }
      return profile;
    }

    async function carregarAula(){
      const profile = await checarAcesso();
      if(!profile) return;
      currentUserId = profile.id;

      const aulaId = getParam('id');
      if(!aulaId){ window.location.href = 'membros.html'; return; }
      currentAulaId = aulaId;

      const { data: aula } = await supabaseClient.from('pdfs').select('*').eq('id', aulaId).single();
      if(!aula){ window.location.href = 'membros.html'; return; }

      const { data: modulo } = await supabaseClient.from('modules').select('*').eq('id', aula.module_id).single();

      document.getElementById('modulo-nome').textContent = modulo ? modulo.titulo : '';
      document.getElementById('aula-nome').textContent = aula.titulo;
      renderizarPdf(aula.url);
      carregarNotas();

      // registra essa aula como "último acesso" (pro botão continuar na dashboard)
      supabaseClient.from('ultimo_acesso').upsert({
        user_id: currentUserId, aula_id: aulaId, atualizado_em: new Date().toISOString()
      }).then(() => {});

      // checa se já está marcada como concluída
      const { data: prog } = await supabaseClient
        .from('progresso').select('*').eq('user_id', currentUserId).eq('aula_id', aulaId).maybeSingle();
      concluida = !!prog;
      atualizarBotaoConcluir();

      // monta navegação entre aulas do mesmo módulo
      const { data: aulasDoModulo } = await supabaseClient
        .from('pdfs').select('*').eq('module_id', aula.module_id).order('ordem', { ascending: true });

      const idx = aulasDoModulo.findIndex(a => a.id === aula.id);
      const anterior = aulasDoModulo[idx - 1];
      const proxima = aulasDoModulo[idx + 1];

      const btnAnt = document.getElementById('btn-anterior');
      const btnProx = document.getElementById('btn-proxima');

      if(anterior){ btnAnt.href = 'aula.html?id=' + anterior.id; }
      else { btnAnt.style.visibility = 'hidden'; }

      if(proxima){ btnProx.href = 'aula.html?id=' + proxima.id; }
      else { btnProx.href = 'membros.html'; btnProx.textContent = 'Voltar aos módulos →'; }
    }

    async function alternarConcluida(){
      const btn = document.getElementById('btn-concluir');
      btn.disabled = true;
      if(concluida){
        await supabaseClient.from('progresso').delete().eq('user_id', currentUserId).eq('aula_id', currentAulaId);
        concluida = false;
      } else {
        await supabaseClient.from('progresso').insert({ user_id: currentUserId, aula_id: currentAulaId });
        concluida = true;
      }
      btn.disabled = false;
      atualizarBotaoConcluir();
    }

    function atualizarBotaoConcluir(){
      const btn = document.getElementById('btn-concluir');
      if(concluida){
        btn.textContent = '✓ Aula concluída';
        btn.classList.add('concluida');
      } else {
        btn.textContent = '✓ Marcar como concluída';
        btn.classList.remove('concluida');
      }
    }

    // ===== ANOTAÇÕES =====
    function toggleNotas(){
      document.getElementById('notas-painel').classList.toggle('open');
    }

    function chaveNotas(){
      return 'notas-aula-' + currentAulaId;
    }

    function salvarNotas(){
      try{
        localStorage.setItem(chaveNotas(), document.getElementById('notas-texto').value);
      } catch(e){ console.error(e); }
    }

    function carregarNotas(){
      try{
        const salvo = localStorage.getItem(chaveNotas());
        document.getElementById('notas-texto').value = salvo || '';
      } catch(e){ console.error(e); }
    }

    function baixarNotas(){
      const texto = document.getElementById('notas-texto').value;
      const titulo = document.getElementById('aula-nome').textContent || 'aula';
      const nomeArquivo = 'anotacoes-' + titulo.toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.txt';
      const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nomeArquivo;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    async function sair(){
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    carregarAula();
  </script>
</body>
</html>
