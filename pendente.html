<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aguardando aprovação</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Status da conta</div>
    <h1>Acesso em análise</h1>
    <div class="divider"></div>
    <div class="card">
      <p style="color:var(--muted); line-height:1.6; margin:0;">
        Seu cadastro foi recebido. Assim que sua entrada for aprovada,
        você poderá acessar todos os módulos normalmente por aqui mesmo.
      </p>
      <a class="btn btn-ghost" style="display:block; margin-top:24px;" href="#" onclick="sair()">Sair</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    async function sair(){
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
