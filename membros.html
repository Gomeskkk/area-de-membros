<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Área de Membros</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <div class="eyebrow">Área de membros</div>
    <a class="logout" href="#" onclick="sair()">Sair</a>
  </div>

  <div class="dash-header">
    <h1 class="dash-titulo">Planta Mestra</h1>
    <p class="dash-sub">Selecione um módulo para continuar a construção</p>
    <a href="simulador.html" class="btn" style="display:inline-block; width:auto; margin-top:18px; padding:10px 20px;">🔧 Simulador de Perfil</a>
  </div>

  <div class="modules-grid" id="modules">
    <p style="color:var(--muted); font-family:'JetBrains Mono',monospace; font-size:13px; padding: 0 40px;">Carregando módulos...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    async function checarAcesso(){
      const { data: { user } } = await supabaseClient.auth.getUser();
      if(!user){ window.location.href = 'login.html'; return null; }

      const { data: profile } = await supabaseClient
        .from('profiles').select('*').eq('id', user.id).single();

      if(!profile || (!profile.approved && !profile.is_admin)){
        window.location.href = 'pendente.html'; return null;
      }
      return profile;
    }

    async function carregarModulos(){
      const profile = await checarAcesso();
      if(!profile) return;

      const { data: modulos } = await supabaseClient
        .from('modules').select('*').order('ordem', { ascending: true });

      const container = document.getElementById('modules');
      if(!modulos || modulos.length === 0){
        container.innerHTML = '<p style="color:var(--muted)">Nenhum módulo publicado ainda.</p>';
        return;
      }

      container.innerHTML = modulos.map((m, i) => `
        <a class="module-card" href="modulo.html?id=${m.id}">
          <div class="module-card-cover">
            ${m.capa_url
              ? `<img src="${m.capa_url}" alt="${m.titulo}">`
              : `<div class="module-card-fallback">${String(i+1).padStart(2,'0')}</div>`}
          </div>
          <div class="module-card-label">${m.titulo}</div>
        </a>`).join('');
    }

    async function sair(){
      await supabaseClient.auth.signOut();
      window.location.href = 'login.html';
    }

    carregarModulos();
  </script>
</body>
</html>
